[project]
name = "linetwin"
version = "0.1.0"
description = "LineTwin: multi-source 3D digital twin with reliable early fault warning"
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "twin-common",
    "twin-sim",
    "twin-backend",
    "twin-ml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "simulator", "backend", "ml"]

[tool.uv.sources]
twin-common = { workspace = true }
twin-sim = { workspace = true }
twin-backend = { workspace = true }
twin-ml = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "matplotlib>=3.11.2",
    "poethepoet>=0.49.0",
]

# ---------------------------------------------------------------- poe (developer tasks)
# The single place for developer tasks: `uv run poe <task>` (list them with `uv run poe`).
# Commands run without a shell, so they behave the same on Windows, Linux and macOS.
# Rules: cross-platform commands only (tools from the uv environment, uv, npm --prefix frontend);
# no bash/PowerShell syntax. Fresh clone: `uv sync --all-packages` first, then `uv run poe install`.
[tool.poe]
# Poe would otherwise auto-select its uv executor (`uv run <cmd>`), which cannot launch npm on
# Windows (npm is npm.cmd). `uv run poe` already puts the project venv on PATH, so the simple
# executor finds ruff/mypy/pytest/python there, and npm.cmd via PATHEXT on Windows.
executor = { type = "simple" }

[tool.poe.tasks.install]
help = "Install Python (uv) and frontend (npm) dependencies"
sequence = [
    { cmd = "uv sync --all-packages" },
    { cmd = "npm --prefix frontend ci" },
]

[tool.poe.tasks.lint]
help = "ruff check, ruff format --check, mypy, eslint, tsc"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
    { cmd = "npm --prefix frontend run lint" },
    { cmd = "npm --prefix frontend run typecheck" },
]

[tool.poe.tasks.fmt]
help = "ruff format, ruff check --fix, eslint --fix"
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
    { cmd = "npm --prefix frontend run lint:fix" },
]

[tool.poe.tasks.test]
help = "pytest, vitest"
sequence = [
    { cmd = "pytest" },
    { cmd = "npm --prefix frontend test" },
]

[tool.poe.tasks.demo-tests]
help = "Phase 11 demo scenarios (a)-(e), real time, about 40 min (run `up` and `deploy-models` first); writes experiments/results/demo_scenarios/; extra args pass through, e.g. -k demo_d"
cmd = "pytest tests/test_phase11_demo.py --run-demo -s"
env = { LINETWIN_DEMO_RESULTS_DIR = "experiments/results/demo_scenarios" }

[tool.poe.tasks.dev]
help = "Simulator publisher for the active source + backend with TimescaleDB (run `up` first); extra args pass through"
cmd = "python -m twin_backend.devstack"

[tool.poe.tasks.api-docs]
help = "Regenerate docs/api.md, frontend/src/api/openapi.json + schema.gen.ts and the line fixtures from the API"
sequence = [
    { cmd = "python -m twin_backend.api.docs" },
    { cmd = "npm --prefix frontend run gen:api" },
]

[tool.poe.tasks.frontend]
help = "Frontend dev server (Vite) on http://127.0.0.1:5173; the 3D twin dev page is /dev.html"
cmd = "npm --prefix frontend run dev"

[tool.poe.tasks.screenshots]
help = """Headless Chromium screenshots: 3D dev page (synthetic) and dashboard (real backend; dev-mode
    shots need `up`, or pass --minimal-only) -> experiments/results/frontend_screenshots/"""
sequence = [
    { cmd = "npm --prefix frontend exec -- playwright install chromium" },
    { cmd = "npm --prefix frontend run screenshots" },
    { cmd = "python -m twin_backend.e2e_stack screenshots" },
]

[tool.poe.tasks.browsers]
help = "Install Playwright's Chromium (and its system libraries on Linux) for the e2e tests"
cmd = "npm --prefix frontend exec -- playwright install --with-deps chromium"

[tool.poe.tasks.minimal]
help = "Backend API from the replay file + SQLite, no Docker/broker/ML (run sim-quick first); extra args pass through"
cmd = "python -m twin_backend serve --mode minimal"

[tool.poe.tasks.sim]
help = "Generate the full dataset: 200 runs x 3600 s -> data/sim/"
cmd = "python -m twin_sim generate --runs 200 --duration 3600 --seed 42 --out data/sim/"

[tool.poe.tasks.sim-quick]
help = "5 short fault-dense runs (+ CSV/JSONL) -> data/sim_quick/"
cmd = "python -m twin_sim generate --quick --out data/sim_quick/ --export csv,jsonl"

[tool.poe.tasks.sim-quick-single]
help = "Same as sim-quick on the single-station line (CNV-01 only) -> data/sim_quick_single/"
cmd = """python -m twin_sim generate --quick --line config/line_single.yaml
    --scenario config/scenarios/quick_single.yaml --out data/sim_quick_single/ --export csv,jsonl"""

[tool.poe.tasks.sim-plots]
help = "Example plots per fault type -> experiments/results/sim_examples/"
cmd = "python -m twin_sim plot-examples --out experiments/results/sim_examples/"

[tool.poe.tasks.sim-mock]
help = "Mock machine server (REST + WebSocket) on mock.base_url; extra args pass through"
cmd = "python -m twin_sim mock-server"

[tool.poe.tasks.sim-mqtt]
help = "MQTT publisher to the broker in sources.yaml (start it with `up`); extra args pass through"
cmd = "python -m twin_sim mqtt"

[tool.poe.tasks.sim-opcua]
help = "OPC UA server on opcua.endpoint; extra args pass through"
cmd = "python -m twin_sim opcua"

[tool.poe.tasks.minimal-data-check]
help = "Minimal mode: sim-quick files -> file adapter -> ingest -> SQLite -> API (no Docker/broker/ML)"
sequence = [
    { ref = "sim-quick" },
    { cmd = "pytest tests/test_phase1_integration.py tests/test_phase2_minimal.py tests/test_phase3_minimal.py tests/test_phase4_minimal.py tests/test_phase5_frontend_contract.py", env = { LINETWIN_MINIMAL_DATA_DIR = "data/sim_quick" } },
]

# ML (Phase 7, Milestone B): dataset, training, E1 report. Configs in config/models/.
[tool.poe.tasks.dataset]
help = "Regenerate data/sim (200 runs x 1 h, default scenario) and build the windowed ML dataset -> data/ml/"
sequence = [
    { ref = "sim" },
    { cmd = "python -m twin_ml.data build" },
]

[tool.poe.tasks.train]
help = "Train + evaluate one model on the E1 dataset, logged to MLflow, e.g. `uv run poe train --model rf --seeds 0,1,2`"
cmd = "python -m twin_ml.train --model ${model} --seeds ${seeds}"
args = [
    { name = "model", required = true, help = "persistence | threshold | rf | xgb | lstm | gru | transformer" },
    { name = "seeds", default = "", help = "comma-separated seeds (default: config/models/eval.yaml)" },
]

[tool.poe.tasks.train-all]
help = "E1: baselines + every model x 3 seeds (config/models/eval.yaml); extra args pass through, e.g. --skip-existing"
cmd = "python -m twin_ml.experiments.e1"

[tool.poe.tasks.report-e1]
help = "Write experiments/results/E1_clean.md + .json + lead-time plot from the MLflow runs"
cmd = "python -m twin_ml.experiments.report_e1"

# Phase 8: robustness, calibration and conformal prediction (config/models/robustness.yaml).
[tool.poe.tasks.sim-sensor-faults]
help = "Regenerate the 200 runs with simulator sensor faults (sf_all / sf_seen / sf_drift, seed 42) -> data/sim_sf_*/"
sequence = [
    { cmd = "python -m twin_sim generate --runs 200 --duration 3600 --seed 42 --scenario config/scenarios/sf_all.yaml --out data/sim_sf_all/" },
    { cmd = "python -m twin_sim generate --runs 200 --duration 3600 --seed 42 --scenario config/scenarios/sf_seen.yaml --out data/sim_sf_seen/" },
    { cmd = "python -m twin_sim generate --runs 200 --duration 3600 --seed 42 --scenario config/scenarios/sf_drift.yaml --out data/sim_sf_drift/" },
]

[tool.poe.tasks.dataset-e4]
help = "Build the E4 condition-shift dataset (low + medium load training runs; config/models/dataset_e4.yaml)"
cmd = "python -m twin_ml.data build --config config/models/dataset_e4.yaml"

[tool.poe.tasks.dataset-aug]
help = "Build the ablation dataset with augmented training series (config/models/dataset_aug.yaml)"
cmd = "python -m twin_ml.data build --config config/models/dataset_aug.yaml"

[tool.poe.tasks.robustness]
help = "Phase 8 study runs, e.g. `uv run poe robustness --study e1models --skip-existing` (e1models | e4 | aug)"
cmd = "python -m twin_ml.experiments.robustness"

[tool.poe.tasks.report-robustness]
help = "Write experiments/results/robustness.md + .json + plots from the MLflow study runs"
cmd = "python -m twin_ml.experiments.report_robustness"

# Phase 9: unseen fault (E5), anomaly detection, explainability (config/models/e5.yaml).
[tool.poe.tasks.sim-e5]
help = "Generate the E5 runs (held-out lubrication_loss, seed 42, indices 0-269; ADR 0024) -> data/sim_e5/"
cmd = "python -m twin_sim generate --runs 270 --duration 3600 --seed 42 --scenario config/scenarios/e5_lubrication_loss.yaml --out data/sim_e5/"

[tool.poe.tasks.e5]
help = "Phase 9 study runs, e.g. `uv run poe e5 --study e5_anomaly --skip-existing`; `--combine` logs the combined policy; `--explain`, `--ae-shares`, `--ig-sensitivity` (exploratory follow-ups, e5_followup.yaml)"
cmd = "python -m twin_ml.experiments.e5"

[tool.poe.tasks.report-e5]
help = "Write experiments/results/e5_explain.md + .json + plots from the MLflow study runs"
cmd = "python -m twin_ml.experiments.report_e5"

[tool.poe.tasks.real-audit]
help = "Phase 10 data audit of MetroPT-3 and Azure PdM (files in data/external/), logged to MLflow P10_real"
cmd = "python -m twin_ml.datasets audit"

[tool.poe.tasks.real-data]
help = "Build the Phase 10 windowed datasets (config/models/real_*.yaml) -> data/ml_real/<key>/"
cmd = "python -m twin_ml.datasets build"

[tool.poe.tasks.real]
help = "Phase 10 study runs, e.g. `uv run poe real --study all --skip-existing` (metropt3, azure, azure_err, azure_holdout); `--combine` logs the combined policies; `--explain` the exploratory explanations"
cmd = "python -m twin_ml.experiments.real"

[tool.poe.tasks.replay-metropt]
help = "Phase 10 replay demo: MetroPT-3 raw slice around a failure -> data/replay/*.csv (config/datasets/metropt3_replay.yaml), summary logged to MLflow"
cmd = "python -m twin_ml.datasets replay-csv --log"

[tool.poe.tasks.minimal-metropt]
help = "Minimal mode on the MetroPT-3 replay CSV (run replay-metropt first): single station, replay speed 30, no Docker/broker/ML"
cmd = "python -m twin_backend serve --mode minimal --line line_single.yaml --file data/replay/metropt3_failure4.csv --replay-speed 30"

[tool.poe.tasks.report-real]
help = "Write experiments/results/real_data.md + .json + plots from the MLflow P10_real runs"
cmd = "python -m twin_ml.experiments.report_real"

[tool.poe.tasks.deploy-models]
help = "Phase 11: build + register the live-inference bundles (gru, xgb, autoencoder; config/models/deploy.yaml), one process each; `--models gru_e4` for the E4 alternative"
cmd = "python -m twin_ml.serve deploy"

[tool.poe.tasks.live-latency]
help = "Phase 11: measure live-inference latency through the worker processes + the gate effect -> experiments/results/live_inference.md / .json"
cmd = "python -m twin_ml.serve latency"

[tool.poe.tasks.drift-report]
help = "Phase 11: drift detection report (false drift on clean runs, synthetic shifts) -> experiments/results/drift.md / .json"
cmd = "python -m twin_ml.serve drift"

[tool.poe.tasks.mlflow-ui]
help = "MLflow UI on the local store (full mlflow in an isolated uv tool environment)"
cmd = "uv tool run --from mlflow==3.17.2 mlflow ui --backend-store-uri mlruns --port 5000"
env = { MLFLOW_ALLOW_FILE_STORE = "true" }

# Event store (config/storage.yaml; sqlite by default, timescale needs `up`).
[tool.poe.tasks.db-migrate]
help = "Apply pending event-store migrations to the configured backend"
cmd = "python -m twin_backend.storage migrate"

[tool.poe.tasks.db-info]
help = "Row counts, time span and snapshots of the configured event store"
cmd = "python -m twin_backend.storage info"

[tool.poe.tasks.db-export]
help = "Export a time range, e.g. `uv run poe db-export --format csv --out data/export/run.csv --from 2026-01-01T00:00:00Z`"
cmd = "python -m twin_backend.storage export"

[tool.poe.tasks.storage-bench]
help = "Write-throughput benchmark of both event stores -> experiments/results/storage_bench.md (timescale needs `up`)"
cmd = "python -m twin_backend.storage.bench"

[tool.poe.tasks.build-frontend]
help = "Production build of the frontend"
cmd = "npm --prefix frontend run build"

# Services (TimescaleDB, Mosquitto) via Docker Compose. Minimal mode never needs them.
[tool.poe.tasks.up]
help = "Start TimescaleDB + Mosquitto (Docker Compose) and wait until healthy"
cmd = "docker compose up -d --wait --wait-timeout 120"

[tool.poe.tasks.down]
help = "Stop the services (data volumes are kept)"
cmd = "docker compose down"

[tool.poe.tasks.reset]
help = "Stop the services and DELETE their data volumes"
cmd = "docker compose down -v"

[tool.poe.tasks.logs]
help = "Service logs; extra args pass through, e.g. `uv run poe logs -f mosquitto`"
cmd = "docker compose logs --tail 200"

[tool.poe.tasks.ps]
help = "Service status and health"
cmd = "docker compose ps"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
# Anchored to the repo root: a bare name such as "data" would also exclude ml/twin_ml/data/.
extend-exclude = ["./frontend", "./data", "./experiments/results"]
# Also skip excluded paths when they are passed explicitly (pre-commit passes file names),
# so `poe lint` and the pre-commit hook check exactly the same files.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["twin_common", "twin_sim", "twin_backend", "twin_ml"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Each workspace member dir is a package root. Test dirs have no __init__.py and test file
# names are unique across the repo, so all `tests` dirs form one namespace package.
files = ["common", "simulator", "backend", "ml", "tests"]
mypy_path = ["common", "simulator", "backend", "ml"]
explicit_package_bases = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# ML code: typed, but untyped helper defs are tolerated (research code).
module = ["twin_ml", "twin_ml.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pyarrow, asyncpg, scikit-learn, threadpoolctl and mlflow ship no (complete) type information.
module = ["pyarrow", "pyarrow.*", "asyncpg", "asyncpg.*", "sklearn", "sklearn.*", "xgboost", "xgboost.*", "threadpoolctl", "threadpoolctl.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["common/tests", "simulator/tests", "backend/tests", "ml/tests", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "services: needs the Docker Compose services (uv run poe up); skipped when unreachable",
    "e2e: drives the dashboard in Playwright's Chromium (uv run poe browsers); skipped without it",
    "demo: real-time Phase 11 demo scenario (about 40 min in all); opt-in: --run-demo (uv run poe demo-tests)",
]
filterwarnings = [
    # Starlette's TestClient asks for the httpx2 package; httpx works and is what we depend on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
