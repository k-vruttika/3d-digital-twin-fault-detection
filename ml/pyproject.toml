[project]
name = "twin-ml"
version = "0.1.0"
description = "LineTwin ML: data, models, calibration, conformal, explanation, experiments"
requires-python = ">=3.11,<3.12"
# Heavy ML dependencies (torch, sklearn, xgboost, ...) are added in the ML phases.
dependencies = ["twin-common"]

[tool.uv.sources]
twin-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin_ml"]
