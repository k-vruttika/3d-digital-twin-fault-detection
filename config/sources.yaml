# Data source selection and ingest tuning. Validated by twin_common.config.SourcesConfig.
# The default is `file` so minimal mode runs with no broker, database or ML.
active: file

# How long the backend waits for a machine to acknowledge a command before reporting TIMEOUT.
command_timeout_s: 5.0

file:
  # Produced by the simulator: `uv run poe sim-quick` (single station: `uv run poe sim-quick-single`
  # writes data/sim_quick_single/run_0000.csv).
  path: data/sim_quick/run_0000.csv
  format: csv                       # csv | jsonl (one Reading per line) | json (array of Readings)
  replay_speed: 1.0                 # 1.0 = real time
  loop: true                        # replay forever; seq and ts continue across loops
  start_offset_s: 0.0               # skip this much event time at the start
  mapping:
    # The simulator CSV uses snake_case columns and carries label columns (fault_type, ...).
    fields:
      machineId: machine_id
      runTime: run_time
    drop_unmapped: true

mock:
  base_url: http://127.0.0.1:8100
  ws_path: /stream
  history_path: /history
  command_path: /command
  scenario_path: /scenario          # simulation only (ADR 0015)
  whatif_path: /whatif              # simulation only (ADR 0031)
  rest_poll_s: 1.0                  # REST fallback poll period while the WebSocket is down
  history_limit: 1000

mqtt:
  host: 127.0.0.1
  port: 1883
  topic_prefix: plant/line1
  client_id: linetwin-backend
  # Telemetry QoS 1 (at least once): no message loss; duplicates are removed by dedup.
  # QoS 0 may legitimately drop messages; QoS 2 costs two extra round trips. See ADR 0007.
  qos: 1
  keepalive_s: 30
  # Persistent MQTT v5 session: while the backend reconnects, the broker queues QoS 1 telemetry
  # for up to this long, so a short outage loses nothing.
  session_expiry_s: 300

opcua:
  endpoint: opc.tcp://127.0.0.1:4840/linetwin/
  namespace: urn:linetwin:sim
  publishing_interval_ms: 100       # subscription publishing interval
  event_queue_size: 10000           # server-side ReadingEvent queue per machine (no loss < this)
  watchdog_s: 2.0                   # no events for this long -> probe the server state
  mapping:
    # Browse names of the simulator's OPC UA variables / ReadingEvent fields.
    fields:
      machineId: MachineId
      seq: Seq
      ts: Ts
      state: State
      speed: Speed
      temp: Temperature
      vib: Vibration
      load: Load
      current: Current
      runTime: RunTime
    drop_unmapped: true

# Exponential backoff for every adapter's reconnect loop.
reconnect:
  initial_s: 0.5
  max_s: 30.0
  multiplier: 2.0
  jitter: 0.2                       # +/- 20 %
  seed: 7

ingest:
  lateness_window_s: 2.0            # hold out-of-order data at most this long; later = LATE
  dedup_window: 4096                # seqs remembered per machine
  seq_reset_threshold: 1000         # seq dropping by more than this = source restarted
  stale_after_s: 3.0                # no data for 3 s -> STALE
  offline_after_s: 5.0              # no data for 5 s -> OFFLINE
  tick_s: 0.25                      # reorder-timeout / staleness housekeeping period
  out_of_range: suspect             # suspect (keep, quality=SUSPECT) | quarantine
  quarantine:
    kind: memory                    # memory | jsonl
    path: null                      # jsonl only, e.g. data/quarantine/quarantine.jsonl
    max_records: 10000

bus:
  queue_size: 10000                 # per subscriber; oldest dropped when a subscriber lags

# ChaosAdapter: seeded transport faults wrapped around the active adapter (tests and demos).
chaos:
  enabled: false
  seed: 1234
  drop: 0.0
  duplicate: 0.0
  delay: 0.0
  delay_s: 1.0
  reorder: 0.0
  reorder_max_displacement: 3
  corrupt: 0.0
