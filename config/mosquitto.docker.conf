# Mosquitto entry config for the CONTAINER (mounted by docker-compose.yml as
# /mosquitto/config/mosquitto.conf). The native fallback uses config/mosquitto.conf.

# All interfaces inside the container, so Docker's port forward can reach the broker.
# The host publishes the port on 127.0.0.1 only (docker-compose.yml).
listener 1883

persistence_location /mosquitto/data/

include_dir /mosquitto/config/conf.d
