# Short, fault-dense runs for smoke tests (`generate --quick`).
name: quick
seed: 42
duration_s: 1800
load_ranges: [low, medium, high]
faults:
  random:
    rate_per_machine_per_hour: 2.0
    types: [bearing_wear, overheating, spindle_imbalance, belt_jam]
    earliest_onset_s: 60
# Job-to-job spindle speed changes on the CNC (SET_SPEED through the command path).
# 7500 RPM keeps the CNC cycle time (6 s x 8000/7500 = 6.4 s) below the 6.5 s arrival interval.
speed_changes:
  - { machine: CNC-01, interval_s: [300, 900], speed_rpm: [7500, 10000] }
