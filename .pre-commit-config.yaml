# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
#
# The hook runs exactly `uv run poe lint` (ruff check, ruff format --check, mypy, eslint, tsc),
# so a commit is checked by the same commands, settings and file sets as `poe lint` and CI.
# It only checks; to fix formatting and auto-fixable findings run `uv run poe fmt`.
# Tool versions come from uv.lock and package-lock.json.
repos:
  - repo: local
    hooks:
      - id: poe-lint
        name: poe lint (ruff, ruff format, mypy, eslint, tsc)
        entry: uv run --frozen poe lint
        language: system
        pass_filenames: false
        always_run: true
