# Mosquitto config for LOCAL DEVELOPMENT on Windows (native install, no Docker).
# Run in the foreground from the repo root:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c config\mosquitto.conf -v
# See docs/setup_windows.md.

# Bind to loopback only, so the broker is not reachable from the network.
listener 1883 127.0.0.1
protocol mqtt

# Anonymous access is acceptable ONLY because the listener is loopback-only.
# Before exposing the broker, set allow_anonymous false and configure password_file.
allow_anonymous true

# Telemetry is persisted by the LineTwin event store, not by the broker.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Reasonable limits for a single-line twin.
max_inflight_messages 100
max_queued_messages 1000
