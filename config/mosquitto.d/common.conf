# Mosquitto settings shared by the container (config/mosquitto.docker.conf) and the native
# fallback (config/mosquitto.conf). No listener and no file paths here: those differ per
# environment and live in the two entry files.

# No per-listener options here (e.g. `protocol`): in a file without a listener they make
# mosquitto create an extra default listener on 1883, which collides with the real one.
# MQTT is the default protocol of the listeners defined in the entry files.

# Anonymous access is acceptable ONLY because the broker is reachable from loopback only
# (native: listener on 127.0.0.1; Docker: port published on 127.0.0.1).
# Before exposing the broker, set allow_anonymous false and configure password_file.
allow_anonymous true

# Retained messages and persistent sessions survive restarts. Telemetry history itself is
# stored by the LineTwin event store, not by the broker.
persistence true
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Reasonable limits for a single-line twin.
max_inflight_messages 100
max_queued_messages 1000
