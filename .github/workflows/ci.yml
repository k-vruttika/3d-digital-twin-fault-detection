name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One definition for every OS: all steps are poe tasks (pyproject.toml), which run without a
  # shell and therefore behave identically on Linux, Windows and macOS.
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # One command per step: on Windows (pwsh) only the last command's exit code would count.
      - name: Install Python dependencies
        run: uv sync --all-packages --locked
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint
        run: uv run --frozen poe lint
      # Docker Compose services (TimescaleDB, Mosquitto) on Ubuntu only: the macOS runners have
      # no Docker and the Windows runners only run Windows containers.
      - name: Start services (Ubuntu)
        if: runner.os == 'Linux'
        run: uv run --frozen poe up
      # Dashboard end-to-end tests (Playwright) run on Ubuntu only, next to the services they need.
      # Windows and macOS install no browser: the e2e tests skip there, everything else runs.
      - name: Playwright Chromium for the e2e tests (Ubuntu)
        if: runner.os == 'Linux'
        run: uv run --frozen poe browsers
      - name: Test
        run: uv run --frozen poe test
        env:
          # Ubuntu: service and e2e tests must run (fail instead of skip). Elsewhere they are skipped.
          LINETWIN_REQUIRE_SERVICES: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Minimal-mode data path (simulator files, no DB/broker/ML)
        run: uv run --frozen poe minimal-data-check
      - name: Frontend build
        run: uv run --frozen poe build-frontend
