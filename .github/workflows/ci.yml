name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One definition for every OS: all steps are poe tasks (pyproject.toml), which run without a
  # shell and therefore behave identically on Linux, Windows and macOS.
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # One command per step: on Windows (pwsh) only the last command's exit code would count.
      - name: Install Python dependencies
        run: uv sync --all-packages --locked
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint
        run: uv run --frozen poe lint
      - name: Test
        run: uv run --frozen poe test
      - name: Minimal-mode data path (simulator files, no DB/broker/ML)
        run: uv run --frozen poe minimal-data-check
      - name: Frontend build
        run: uv run --frozen poe build-frontend
