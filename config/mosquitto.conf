# Mosquitto entry config for the NATIVE FALLBACK (the main path is Docker Compose:
# `uv run poe up`, which uses config/mosquitto.docker.conf). Run from the repository root,
# because include_dir below is relative to the working directory:
#   mosquitto -c config/mosquitto.conf -v
# Windows: & "C:\Program Files\mosquitto\mosquitto.exe" -c config\mosquitto.conf -v
# Persistence is written to ./mosquitto.db (gitignored). See docs/setup.md.

# Loopback only, so the broker is not reachable from the network.
listener 1883 127.0.0.1

include_dir config/mosquitto.d
