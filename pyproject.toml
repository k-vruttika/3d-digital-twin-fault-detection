[project]
name = "linetwin"
version = "0.1.0"
description = "LineTwin: multi-source 3D digital twin with reliable early fault warning"
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "twin-common",
    "twin-sim",
    "twin-backend",
    "twin-ml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "simulator", "backend", "ml"]

[tool.uv.sources]
twin-common = { workspace = true }
twin-sim = { workspace = true }
twin-backend = { workspace = true }
twin-ml = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "matplotlib>=3.11.2",
    "poethepoet>=0.49.0",
]

# ---------------------------------------------------------------- poe (developer tasks)
# The single place for developer tasks: `uv run poe <task>` (list them with `uv run poe`).
# Commands run without a shell, so they behave the same on Windows, Linux and macOS.
# Rules: cross-platform commands only (tools from the uv environment, uv, npm --prefix frontend);
# no bash/PowerShell syntax. Fresh clone: `uv sync --all-packages` first, then `uv run poe install`.
[tool.poe]
# Poe would otherwise auto-select its uv executor (`uv run <cmd>`), which cannot launch npm on
# Windows (npm is npm.cmd). `uv run poe` already puts the project venv on PATH, so the simple
# executor finds ruff/mypy/pytest/python there, and npm.cmd via PATHEXT on Windows.
executor = { type = "simple" }

[tool.poe.tasks.install]
help = "Install Python (uv) and frontend (npm) dependencies"
sequence = [
    { cmd = "uv sync --all-packages" },
    { cmd = "npm --prefix frontend ci" },
]

[tool.poe.tasks.lint]
help = "ruff check, ruff format --check, mypy, eslint, tsc"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy" },
    { cmd = "npm --prefix frontend run lint" },
    { cmd = "npm --prefix frontend run typecheck" },
]

[tool.poe.tasks.fmt]
help = "ruff format, ruff check --fix, eslint --fix"
sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
    { cmd = "npm --prefix frontend run lint:fix" },
]

[tool.poe.tasks.test]
help = "pytest, vitest"
sequence = [
    { cmd = "pytest" },
    { cmd = "npm --prefix frontend test" },
]

[tool.poe.tasks.dev]
help = "Full stack: backend + frontend (Phase 2+)"
cmd = """python -c "import sys; sys.exit('dev is not implemented yet; it needs the backend and frontend (Phase 2+).')" """

[tool.poe.tasks.minimal]
help = "3D twin from a JSON/CSV file, no DB/broker/ML (Phase 4)"
cmd = """python -c "import sys; sys.exit('minimal is not implemented yet; the file adapter and ingest exist (Phase 2), the API and frontend arrive in Phase 4.')" """

[tool.poe.tasks.sim]
help = "Generate the full dataset: 200 runs x 3600 s -> data/sim/"
cmd = "python -m twin_sim generate --runs 200 --duration 3600 --seed 42 --out data/sim/"

[tool.poe.tasks.sim-quick]
help = "5 short fault-dense runs (+ CSV/JSONL) -> data/sim_quick/"
cmd = "python -m twin_sim generate --quick --out data/sim_quick/ --export csv,jsonl"

[tool.poe.tasks.sim-quick-single]
help = "Same as sim-quick on the single-station line (CNV-01 only) -> data/sim_quick_single/"
cmd = """python -m twin_sim generate --quick --line config/line_single.yaml
    --scenario config/scenarios/quick_single.yaml --out data/sim_quick_single/ --export csv,jsonl"""

[tool.poe.tasks.sim-plots]
help = "Example plots per fault type -> experiments/results/sim_examples/"
cmd = "python -m twin_sim plot-examples --out experiments/results/sim_examples/"

[tool.poe.tasks.sim-mock]
help = "Mock machine server (REST + WebSocket) on mock.base_url; extra args pass through"
cmd = "python -m twin_sim mock-server"

[tool.poe.tasks.sim-mqtt]
help = "MQTT publisher to the broker in sources.yaml (start it with `up`); extra args pass through"
cmd = "python -m twin_sim mqtt"

[tool.poe.tasks.sim-opcua]
help = "OPC UA server on opcua.endpoint; extra args pass through"
cmd = "python -m twin_sim opcua"

[tool.poe.tasks.minimal-data-check]
help = "Minimal-mode data path: sim-quick files -> file adapter -> ingest -> bus -> SQLite (no Docker/broker/ML)"
sequence = [
    { ref = "sim-quick" },
    { cmd = "pytest tests/test_phase1_integration.py tests/test_phase2_minimal.py tests/test_phase3_minimal.py", env = { LINETWIN_MINIMAL_DATA_DIR = "data/sim_quick" } },
]

# Event store (config/storage.yaml; sqlite by default, timescale needs `up`).
[tool.poe.tasks.db-migrate]
help = "Apply pending event-store migrations to the configured backend"
cmd = "python -m twin_backend.storage migrate"

[tool.poe.tasks.db-info]
help = "Row counts, time span and snapshots of the configured event store"
cmd = "python -m twin_backend.storage info"

[tool.poe.tasks.db-export]
help = "Export a time range, e.g. `uv run poe db-export --format csv --out data/export/run.csv --from 2026-01-01T00:00:00Z`"
cmd = "python -m twin_backend.storage export"

[tool.poe.tasks.storage-bench]
help = "Write-throughput benchmark of both event stores -> experiments/results/storage_bench.md (timescale needs `up`)"
cmd = "python -m twin_backend.storage.bench"

[tool.poe.tasks.build-frontend]
help = "Production build of the frontend"
cmd = "npm --prefix frontend run build"

# Services (TimescaleDB, Mosquitto) via Docker Compose. Minimal mode never needs them.
[tool.poe.tasks.up]
help = "Start TimescaleDB + Mosquitto (Docker Compose) and wait until healthy"
cmd = "docker compose up -d --wait --wait-timeout 120"

[tool.poe.tasks.down]
help = "Stop the services (data volumes are kept)"
cmd = "docker compose down"

[tool.poe.tasks.reset]
help = "Stop the services and DELETE their data volumes"
cmd = "docker compose down -v"

[tool.poe.tasks.logs]
help = "Service logs; extra args pass through, e.g. `uv run poe logs -f mosquitto`"
cmd = "docker compose logs --tail 200"

[tool.poe.tasks.ps]
help = "Service status and health"
cmd = "docker compose ps"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "experiments/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["twin_common", "twin_sim", "twin_backend", "twin_ml"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Each workspace member dir is a package root. Test dirs have no __init__.py and test file
# names are unique across the repo, so all `tests` dirs form one namespace package.
files = ["common", "simulator", "backend", "ml", "tests"]
mypy_path = ["common", "simulator", "backend", "ml"]
explicit_package_bases = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# ML code is research-heavy; relaxed until the ML phases tighten it.
module = ["twin_ml", "twin_ml.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pyarrow and asyncpg ship no type information.
module = ["pyarrow", "pyarrow.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["common/tests", "simulator/tests", "backend/tests", "ml/tests", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "services: needs the Docker Compose services (uv run poe up); skipped when unreachable",
]
filterwarnings = [
    # Starlette's TestClient asks for the httpx2 package; httpx works and is what we depend on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
