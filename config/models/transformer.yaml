# Small Transformer encoder on raw normalised windows (twin_ml.models.nn): linear projection,
# learned positions, pre-norm encoder layers, mean pooling; same heads as the RNNs.
type: transformer
class_weight: {power: 0.5, max: 50.0}
arch:
  hidden: 64                         # d_model
  layers: 2
  heads: 4
  ff_mult: 2                         # feed-forward width = 2 * d_model
  dropout: 0.1
training:
  early_stopping:                    # fixed budget: no early stop; checkpoint by best EMA of val macro F1
    max_epochs: 22                   # every run trains exactly 22 epochs (chosen from validation curves only, ADR 0020)
    patience: null                   # null = never stop on patience
    ema_alpha: 0.4                   # weight of the newest epoch (1 = no smoothing)
    checkpoint_by: ema               # keep the weights of the epoch with the best EMA
  lr_schedule:                       # cosine decay lr -> min_lr over max_epochs: identical annealing for every run
    type: cosine
    min_lr: 0.00001
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  focal_gamma: 0.0
  huber_delta: 0.1
  loss_weights: {cls: 1.0, ttf: 0.5, fault_type: 0.3}
  eval_batch_size: 4096
  num_threads: null
