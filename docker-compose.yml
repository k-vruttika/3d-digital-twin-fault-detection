# LineTwin services: TimescaleDB (PostgreSQL 16) and Mosquitto 2.
#   uv run poe up      start and wait until healthy      uv run poe down    stop
#   uv run poe reset   stop and delete volumes           uv run poe logs / ps
# Settings come from .env (copy .env.example); the defaults below apply without one.
# All ports are published on 127.0.0.1 only. Minimal mode never needs these services.
# See docs/setup.md and docs/adr/0005-docker-compose-services.md.
name: linetwin

services:
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_DB: ${LINETWIN_PG_DB:-linetwin}
      POSTGRES_USER: ${LINETWIN_PG_USER:-linetwin}
      POSTGRES_PASSWORD: ${LINETWIN_PG_PASSWORD:-linetwin-dev}
    ports:
      - "127.0.0.1:${LINETWIN_PG_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      # TCP probe: the image's temporary init server listens on the unix socket only,
      # so this cannot report healthy before initialisation has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"   # fixed: must match config/sources.yaml (mqtt.port)
    volumes:
      - ./config/mosquitto.docker.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto.d:/mosquitto/config/conf.d:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "linetwin/healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  timescale-data:
  mosquitto-data:
