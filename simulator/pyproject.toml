[project]
name = "twin-sim"
version = "0.1.0"
description = "LineTwin production line simulator and publishers"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "pyarrow>=26.0.1",
    "twin-common",
]

[tool.uv.sources]
twin-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin_sim"]
